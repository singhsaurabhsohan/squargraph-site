# Function-specific gateway configuration.
# These three endpoints are intentionally callable without Supabase gateway JWT validation:
# - public-form-submit applies origin checks, rate limiting, reCAPTCHA, and lead email-token validation in code.
# - squargraph-payments creates and verifies provider-backed orders and never trusts browser prices.
# - squargraph-payment-webhook authenticates Razorpay using the raw-body HMAC signature.

[functions.public-form-submit]
verify_jwt = false

[functions.squargraph-payments]
verify_jwt = false

[functions.squargraph-payment-webhook]
verify_jwt = false
